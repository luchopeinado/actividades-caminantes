    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Aquí van TUS claves oficiales de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBjheviIcID66M9RorsKaUhIJ_zyLBydRI",
            authDomain: "calendario-scout-590d0.firebaseapp.com",
            projectId: "calendario-scout-590d0",
            storageBucket: "calendario-scout-590d0.firebasestorage.app",
            messagingSenderId: "1088652778101",
            appId: "1:1088652778101:web:a4e70c7507caf8e805763c",
            measurementId: "G-79J6LPQLYY"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let isAdmin = false;
        let activities = [];
        let editingId = null; 
        
        const listaCaminantes = [
            "Jerónimo Rivella", "Giuliana Porta", "Jazmín Pereyra", 
            "Sara Pintos", "Francisco Fontana", "Tomás Obregón",
            "Helena Rivella", "Morena Donaire", "Ludmila Andrada",
            "Estefania Cavaglia", "Bautista Lopez", "Nicolas Porta"
        ];

        let currentAttendanceSelection = []; 
        let focusDate = new Date();
        let currentTimeline = []; 

        function getLocalDateString(date) {
            const d = new Date(date);
            const offset = d.getTimezoneOffset() * 60000;
            return (new Date(d - offset)).toISOString().split('T')[0];
        }

        function formatDayHeader(dateStr) {
            const date = new Date(dateStr + 'T12:00:00');
            const dayName = date.toLocaleDateString('es-ES', { weekday: 'long' });
            const dayNum = date.toLocaleDateString('es-ES', { day: 'numeric' });
            return `${dayName.charAt(0).toUpperCase() + dayName.slice(1)} ${dayNum}`;
        }
        
        function formatShortDayHeader(dateStr) {
             const date = new Date(dateStr + 'T12:00:00');
             return date.toLocaleDateString('es-ES', { month: 'long', year:'numeric' }).replace(/^\w/, (c) => c.toUpperCase());
        }

        // Calcula timeline: Sábados + días con actividades
        function calculateTimeline(centerDateStr) {
            let datesSet = new Set();
            activities.forEach(act => datesSet.add(act.date));
            
            let centerDateObj = new Date(centerDateStr + 'T12:00:00');
            let start = new Date(centerDateObj);
            start.setDate(start.getDate() - 60); 
            
            for(let i = 0; i < 120; i++) {
                let d = new Date(start);
                d.setDate(d.getDate() + i);
                if (d.getDay() === 6) { 
                    datesSet.add(getLocalDateString(d));
                }
            }
            
            let sortedDates = Array.from(datesSet).sort();
            if (!sortedDates.includes(centerDateStr)) {
                sortedDates.push(centerDateStr);
                sortedDates.sort();
            }
            
            let centerIndex = sortedDates.indexOf(centerDateStr);
            let result = [];
            
            // Tomamos el centro, uno antes y uno después
            for(let i = -1; i <= 1; i++) {
                let idx = centerIndex + i;
                if(idx >= 0 && idx < sortedDates.length) {
                    result.push(sortedDates[idx]);
                }
            }
            return [...new Set(result)].sort();
        }

        function renderAgenda() {
            const container = document.getElementById('agenda-container');
            const viewDateDisplay = document.getElementById('current-view-date');
            if(!container) return;
            
            container.innerHTML = '';
            const centerDateStr = getLocalDateString(focusDate);
            currentTimeline = calculateTimeline(centerDateStr);
            
            viewDateDisplay.textContent = formatShortDayHeader(centerDateStr);

            currentTimeline.forEach((dateStr) => {
                const isCenter = dateStr === centerDateStr;
                
                let dayActivities = activities.filter(act => act.date === dateStr);
                dayActivities.sort((a, b) => {
                    if (!a.hora) return 1;
                    if (!b.hora) return -1;
                    return a.hora.localeCompare(b.hora);
                });

                // Tarjeta/Columna que representa un día
                const columnEl = document.createElement('div');
                columnEl.className = `snap-center shrink-0 w-[90%] md:w-[calc(33.333%-16px)] flex flex-col h-full bg-white rounded-lg border shadow-sm transition-all duration-300 ${isCenter ? 'border-blue-300 shadow-md transform scale-100' : 'border-gray-200 opacity-90 transform scale-[0.98]'}`;
                columnEl.id = `col-${dateStr}`;
                
                // Cabecera celeste (Sábado 10)
                let columnHtml = `
                    <div class="${isCenter ? 'bg-[#c6d8fc]' : 'bg-gray-200'} py-2 px-3 text-center font-bold text-[17px] text-gray-800 border-b border-black/10 rounded-t-lg">
                        ${formatDayHeader(dateStr)}
                    </div>
                `;

                if (dayActivities.length === 0) {
                     columnHtml += `
                        <div class="flex-grow flex flex-col items-center justify-center p-6 text-gray-400">
                            <i class="fa-solid fa-campground text-4xl mb-3 opacity-20"></i>
                            <p class="text-sm font-medium">Libre</p>
                        </div>
                     `;
                } else {
                    columnHtml += `<div class="flex-grow overflow-y-auto custom-scrollbar p-1">`;
                    
                    dayActivities.forEach(act => {
                        columnHtml += `
                            <div class="group flex border-b border-gray-100 last:border-0 hover:bg-blue-50/50 cursor-pointer transition-colors p-2 text-sm ${act.completed ? 'opacity-60 bg-gray-50' : ''}" onclick="window.openActivityModal('${act.id}')">
                                <!-- Hora -->
                                <div class="w-14 shrink-0 font-semibold text-gray-600 pt-0.5 border-r border-gray-100 mr-2 pr-2 flex flex-col items-start">
                                    <span>${act.hora ? act.hora.replace(':', '.') : '--.--'}</span>
                                </div>
                                
                                <!-- Datos -->
                                <div class="flex-grow min-w-0 pr-1 flex flex-col justify-center">
                                    <div class="font-bold text-gray-900 leading-tight ${act.completed ? 'line-through text-gray-500' : ''} truncate mb-0.5">
                                        ${act.title}
                                    </div>
                                    
                                    <!-- Observaciones (Oculto en móvil, visible en md) -->
                                    ${act.lugar ? `<div class="hidden md:block text-xs text-gray-500 truncate mb-0.5"><i class="fa-solid fa-location-dot mr-1 opacity-50"></i>${act.lugar}</div>` : ''}
                                    
                                    <!-- Encargado -->
                                    <div class="text-[11px] text-gray-500 uppercase tracking-wide truncate">
                                        ${act.coordinador || '--'}
                                    </div>
                                </div>
                                
                                <!-- Icono modal -->
                                <div class="w-6 shrink-0 flex items-center justify-center text-gray-300 group-hover:text-scout-blue">
                                    <i class="fa-solid fa-chevron-right text-xs"></i>
                                </div>
                            </div>
                        `;
                    });

                    columnHtml += `</div>`;
                }

                columnEl.innerHTML = columnHtml;
                container.appendChild(columnEl);
            });

            // Forzar el scroll hacia el centro
            setTimeout(() => {
                const centerCol = document.getElementById(`col-${centerDateStr}`);
                if (centerCol && container) {
                    const scrollPos = centerCol.offsetLeft - (container.offsetWidth / 2) + (centerCol.offsetWidth / 2);
                    container.scrollTo({ left: scrollPos, behavior: 'smooth' });
                }
            }, 50);
        }

        window.openModal = function(id) {
            document.getElementById(id).classList.remove('hidden');
        }
        
        window.closeModal = function(id) {
            document.getElementById(id).classList.add('hidden');
        }

        window.toggleForm = function(forceOpen = false) {
            const form = document.getElementById('activity-form');
            const chevron = document.getElementById('form-chevron');
            if (form.classList.contains('hidden') || forceOpen) {
                form.classList.remove('hidden');
                chevron.style.transform = 'rotate(0deg)';
            } else {
                form.classList.add('hidden');
                chevron.style.transform = 'rotate(180deg)';
            }
        }

        window.onclick = function(event) {
            if (event.target.id === 'activity-modal' || event.target.id === 'attendance-modal' || event.target.id === 'login-modal' || event.target.id === 'stats-modal') {
                window.closeModal(event.target.id);
            }
        }

        window.openAttendanceModal = function() {
            const container = document.getElementById('attendance-list-container');
            container.innerHTML = listaCaminantes.map((name) => {
                const isChecked = currentAttendanceSelection.includes(name) ? 'checked' : '';
                return `
                <label class="flex items-center space-x-3 p-3 border-b border-gray-100 hover:bg-gray-50 cursor-pointer rounded">
                    <input type="checkbox" value="${name}" class="attendance-cb w-4 h-4 text-scout-blue rounded focus:ring-scout-blue" ${isChecked}>
                    <span class="text-gray-700 font-medium">${name}</span>
                </label>`;
            }).join('');
            window.openModal('attendance-modal');
        }

        window.saveAttendanceForm = function() {
            const checkboxes = document.querySelectorAll('.attendance-cb:checked');
            currentAttendanceSelection = Array.from(checkboxes).map(cb => cb.value);
            document.getElementById('attendance-count').textContent = currentAttendanceSelection.length;
            window.closeModal('attendance-modal');
        }

        window.openStatsModal = function() {
            const totalActs = activities.length;
            document.getElementById('total-act-count').textContent = totalActs;
            
            let statsData = listaCaminantes.map(name => {
                let count = activities.filter(a => a.asistencia && a.asistencia.includes(name)).length;
                let percentage = totalActs > 0 ? Math.round((count / totalActs) * 100) : 0;
                return { name, count, percentage };
            });

            statsData.sort((a, b) => b.count - a.count);

            const tbody = document.getElementById('stats-table-body');
            tbody.innerHTML = statsData.map(data => `
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-3 font-medium text-gray-800">${data.name}</td>
                    <td class="px-4 py-3 text-center text-gray-600">${data.count}</td>
                    <td class="px-4 py-3 text-right">
                        <span class="inline-block bg-${data.percentage >= 70 ? 'green' : (data.percentage >= 40 ? 'yellow' : 'red')}-100 text-${data.percentage >= 70 ? 'green' : (data.percentage >= 40 ? 'yellow' : 'red')}-800 px-2 py-1 rounded text-xs font-bold w-12 text-center">
                            ${data.percentage}%
                        </span>
                    </td>
                </tr>
            `).join('');

            window.openModal('stats-modal');
        }

        window.openActivityModal = function(id) {
            const act = activities.find(a => a.id === id);
            if (!act) return;

            document.getElementById('modal-title').textContent = act.title;
            const content = document.getElementById('modal-content');
            
            const areaTags = (act.areas || []).map(area => 
                `<span class="bg-blue-100 text-scout-blue text-xs font-semibold px-2.5 py-1 rounded-md border border-blue-200">${area}</span>`
            ).join('');

            const attendanceList = (act.asistencia && act.asistencia.length > 0) 
                ? act.asistencia.map(name => `<li class="flex items-center text-sm text-gray-700 mb-1"><i class="fa-solid fa-check text-green-500 mr-2 w-4"></i> ${name}</li>`).join('')
                : '<p class="text-sm text-gray-500 italic">No se registró asistencia</p>';

            const attachmentHtml = act.imagen_url ? `
                <div class="mt-4 mb-4">
                    <h4 class="font-bold text-scout-blue flex items-center border-b border-gray-100 pb-1 mb-3"><i class="fa-solid fa-paperclip mr-2 w-4"></i> Material Adjunto</h4>
                    ${act.imagen_url.match(/\.(jpeg|jpg|gif|png|webp)(\?.*)?$/i)
                        ? `<a href="${act.imagen_url}" target="_blank" class="block bg-gray-50 p-2 rounded-lg border border-gray-200 hover:opacity-90 transition-opacity w-fit"><img src="${act.imagen_url}" alt="Material Adjunto" class="max-h-48 rounded object-contain"></a>`
                        : `<a href="${act.imagen_url}" target="_blank" class="inline-flex items-center px-4 py-2.5 bg-blue-50 text-scout-blue rounded-lg border border-blue-200 hover:bg-blue-100 transition-colors text-sm font-medium shadow-sm"><i class="fa-brands fa-google-drive mr-2 text-lg"></i> Abrir Enlace Adjunto (Drive, Pinterest, etc)</a>`
                    }
                </div>
            ` : '';

            const adminButtons = isAdmin ? `
                <div class="mt-8 pt-4 border-t border-gray-200 flex flex-wrap justify-end gap-3">
                     <button onclick="window.deleteActivity('${act.id}')" class="px-4 py-2.5 border border-red-200 text-red-600 rounded-lg hover:bg-red-50 font-medium text-sm transition-colors">
                        <i class="fa-solid fa-trash mr-1"></i> Eliminar
                    </button>
                    <button onclick="window.startEditActivity('${act.id}')" class="px-4 py-2.5 border border-blue-200 text-scout-blue rounded-lg hover:bg-blue-50 font-medium text-sm transition-colors">
                        <i class="fa-solid fa-pen mr-1"></i> Editar
                    </button>
                    <button onclick="window.toggleStatus('${act.id}')" class="px-4 py-2.5 ${act.completed ? 'bg-orange-500 hover:bg-orange-600' : 'bg-green-600 hover:bg-green-700'} text-white rounded-lg font-medium text-sm transition-colors">
                        ${act.completed ? '<i class="fa-solid fa-rotate-left mr-1"></i> Marcar Pendiente' : '<i class="fa-solid fa-check mr-1"></i> Marcar Completada'}
                    </button>
                </div>
            ` : '';

            content.innerHTML = `
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6 bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <div>
                        <span class="block text-[10px] uppercase text-gray-500 font-bold tracking-wider mb-1">Fecha y Hora</span>
                        <span class="font-semibold text-gray-800 text-sm"><i class="fa-regular fa-calendar text-scout-blue mr-1"></i> ${act.date} ${act.hora ? '| ' + act.hora : ''}</span>
                    </div>
                    <div>
                        <span class="block text-[10px] uppercase text-gray-500 font-bold tracking-wider mb-1">Encargado</span>
                        <span class="font-semibold text-gray-800 text-sm"><i class="fa-solid fa-user-tie text-scout-blue mr-1"></i> ${act.coordinador || '--'}</span>
                    </div>
                    <div>
                        <span class="block text-[10px] uppercase text-gray-500 font-bold tracking-wider mb-1">Lugar/Obs.</span>
                        <span class="font-semibold text-gray-800 text-sm"><i class="fa-solid fa-location-dot text-scout-blue mr-1"></i> ${act.lugar || '--'}</span>
                    </div>
                    <div>
                        <span class="block text-[10px] uppercase text-gray-500 font-bold tracking-wider mb-1">Estado</span>
                        <span class="font-semibold text-sm ${act.completed ? 'text-green-600' : 'text-orange-500'}">
                            <i class="fa-solid ${act.completed ? 'fa-check-circle' : 'fa-circle-dot'} mr-1"></i> ${act.completed ? 'Completada' : 'Pendiente'}
                        </span>
                    </div>
                </div>

                ${areaTags ? `<div class="mb-6"><h4 class="text-xs font-bold text-gray-400 mb-2 uppercase tracking-wide">Áreas de Desarrollo</h4><div class="flex flex-wrap gap-2">${areaTags}</div></div>` : ''}

                ${attachmentHtml}

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-2 space-y-5">
                        ${act.objetivo ? `<div><h4 class="font-bold text-scout-blue flex items-center border-b border-gray-100 pb-1 mb-2"><i class="fa-solid fa-bullseye mr-2 w-4"></i> Objetivo</h4><p class="text-gray-700 text-sm bg-white">${act.objetivo}</p></div>` : ''}
                        ${act.materiales ? `<div><h4 class="font-bold text-scout-blue flex items-center border-b border-gray-100 pb-1 mb-2"><i class="fa-solid fa-box-open mr-2 w-4"></i> Materiales</h4><p class="text-gray-700 text-sm bg-white">${act.materiales}</p></div>` : ''}
                        ${act.introduccion ? `<div><h4 class="font-bold text-scout-blue flex items-center border-b border-gray-100 pb-1 mb-2"><i class="fa-solid fa-door-open mr-2 w-4"></i> Introducción</h4><p class="text-gray-700 text-sm bg-white">${act.introduccion}</p></div>` : ''}
                        ${act.desarrollo ? `<div><h4 class="font-bold text-scout-blue flex items-center border-b border-gray-100 pb-1 mb-2"><i class="fa-solid fa-person-hiking mr-2 w-4"></i> Desarrollo</h4><p class="text-gray-700 text-sm bg-white whitespace-pre-wrap">${act.desarrollo}</p></div>` : ''}
                        ${act.conclusion ? `<div><h4 class="font-bold text-scout-blue flex items-center border-b border-gray-100 pb-1 mb-2"><i class="fa-solid fa-flag-checkered mr-2 w-4"></i> Conclusión</h4><p class="text-gray-700 text-sm bg-white">${act.conclusion}</p></div>` : ''}
                        ${act.plan_b ? `<div><h4 class="font-bold text-red-600 flex items-center border-b border-red-100 pb-1 mb-2"><i class="fa-solid fa-life-ring mr-2 w-4"></i> Plan B</h4><p class="text-gray-700 text-sm bg-red-50 p-3 rounded-lg border border-red-100">${act.plan_b}</p></div>` : ''}
                    </div>
                    
                    <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 h-fit">
                        <h4 class="font-bold text-gray-800 flex items-center border-b border-gray-200 pb-2 mb-3">
                            <i class="fa-solid fa-clipboard-user mr-2 text-scout-blue"></i> Asistencia (${act.asistencia ? act.asistencia.length : 0})
                        </h4>
                        <ul class="space-y-1 max-h-[300px] overflow-y-auto custom-scrollbar">
                            ${attendanceList}
                        </ul>
                    </div>
                </div>

                ${adminButtons}
            `;
            window.openModal('activity-modal');
        }

        window.startEditActivity = function(id) {
            const act = activities.find(a => a.id === id);
            if (!act) return;

            editingId = id; 
            
            document.getElementById('title').value = act.title || '';
            document.getElementById('date').value = act.date || '';
            document.getElementById('hora').value = act.hora || '';
            document.getElementById('coordinador').value = act.coordinador || '';
            document.getElementById('lugar').value = act.lugar || '';
            document.getElementById('imagen_url').value = act.imagen_url || '';
            document.getElementById('objetivo').value = act.objetivo || '';
            document.getElementById('materiales').value = act.materiales || '';
            document.getElementById('introduccion').value = act.introduccion || '';
            document.getElementById('desarrollo').value = act.desarrollo || '';
            document.getElementById('conclusion').value = act.conclusion || '';
            document.getElementById('plan_b').value = act.plan_b || '';

            const checkboxes = document.querySelectorAll('#areas-container input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = act.areas && act.areas.includes(cb.value);
            });

            currentAttendanceSelection = act.asistencia ? [...act.asistencia] : [];
            document.getElementById('attendance-count').textContent = currentAttendanceSelection.length;

            document.getElementById('form-header-title').innerHTML = '<i class="fa-solid fa-pen mr-2"></i>Editando Actividad';
            document.getElementById('form-header-title').classList.add('text-orange-600');
            
            const btnSubmit = document.getElementById('btn-submit-form');
            btnSubmit.innerHTML = '<i class="fa-solid fa-save mr-2"></i> Actualizar Actividad';
            btnSubmit.className = 'w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-sm flex items-center justify-center';
            
            document.getElementById('btn-cancel-edit').classList.remove('hidden');

            window.closeModal('activity-modal'); 
            window.toggleForm(true); 
            document.getElementById('form-column').scrollIntoView({ behavior: 'smooth' }); 
        }

        window.cancelEdit = function() {
            editingId = null;
            document.getElementById('activity-form').reset();
            currentAttendanceSelection = [];
            document.getElementById('attendance-count').textContent = '0';
            document.getElementById('date').value = getLocalDateString(focusDate); 
            document.getElementById('imagen_url').value = '';

            document.getElementById('form-header-title').innerHTML = '<i class="fa-solid fa-plus-circle mr-2"></i>Nueva Actividad';
            document.getElementById('form-header-title').classList.remove('text-orange-600');
            
            const btnSubmit = document.getElementById('btn-submit-form');
            btnSubmit.innerHTML = '<i class="fa-solid fa-thumbtack mr-2"></i> Fijar Actividad';
            btnSubmit.className = 'w-full bg-scout-blue hover:bg-blue-800 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-sm flex items-center justify-center';
            
            document.getElementById('btn-cancel-edit').classList.add('hidden');
        }

        window.toggleStatus = async function(id) {
            if (!isAdmin) return;
            const act = activities.find(a => a.id === id);
            if (act) {
                const docRef = doc(db, 'activities', id);
                await updateDoc(docRef, { completed: !act.completed });
                window.closeModal('activity-modal');
            }
        }

        window.deleteActivity = async function(id) {
            if (!isAdmin) return;
            if(confirm("¿Estás seguro que deseas eliminar esta actividad?")) {
                const docRef = doc(db, 'activities', id);
                await deleteDoc(docRef);
                window.closeModal('activity-modal');
            }
        }

        window.onload = function() {
            document.getElementById('date').value = getLocalDateString(focusDate);
            
            onAuthStateChanged(auth, (user) => {
                const formCol = document.getElementById('form-column');
                const agendaCol = document.getElementById('agenda-column');
                const btnLogin = document.getElementById('btn-login-modal');
                const btnLogout = document.getElementById('btn-logout');
                const btnStats = document.getElementById('btn-stats'); 

                if (user) {
                    isAdmin = true;
                    formCol.classList.remove('hidden');
                    agendaCol.classList.remove('lg:col-span-12');
                    agendaCol.classList.add('lg:col-span-9');
                    btnLogin.classList.add('hidden');
                    btnLogout.classList.remove('hidden');
                    btnStats.classList.remove('hidden');
                } else {
                    isAdmin = false;
                    formCol.classList.add('hidden');
                    agendaCol.classList.remove('lg:col-span-9');
                    agendaCol.classList.add('lg:col-span-12');
                    btnLogin.classList.remove('hidden');
                    btnLogout.classList.add('hidden');
                    btnStats.classList.add('hidden');
                    cancelEdit(); 
                }
                window.closeModal('login-modal');
                
                if (!document.getElementById('activity-modal').classList.contains('hidden')) {
                    window.closeModal('activity-modal');
                }
                
                setTimeout(renderAgenda, 100);
            });

            const activitiesRef = collection(db, 'activities');
            onSnapshot(activitiesRef, (snapshot) => {
                activities = [];
                snapshot.forEach((docSnap) => {
                    activities.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderAgenda();
            }, (error) => {
                console.error("Error sincronizando actividades:", error);
            });

            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('login-username').value.trim().toLowerCase();
                const pass = document.getElementById('login-password').value;
                const fakeEmail = username + '@champaqui.app';
                
                try {
                    await signInWithEmailAndPassword(auth, fakeEmail, pass);
                    document.getElementById('login-form').reset();
                } catch (error) {
                    alert('Usuario o contraseña incorrectos.');
                }
            });

            document.getElementById('btn-logout').addEventListener('click', () => {
                signOut(auth);
            });

            document.getElementById('btn-prev-day').addEventListener('click', () => {
                const centerDateStr = getLocalDateString(focusDate);
                const idx = currentTimeline.indexOf(centerDateStr);
                if (idx > 0) {
                    focusDate = new Date(currentTimeline[idx - 1] + 'T12:00:00');
                    if(!editingId) document.getElementById('date').value = getLocalDateString(focusDate);
                    renderAgenda();
                }
            });

            document.getElementById('btn-next-day').addEventListener('click', () => {
                const centerDateStr = getLocalDateString(focusDate);
                const idx = currentTimeline.indexOf(centerDateStr);
                if (idx !== -1 && idx < currentTimeline.length - 1) {
                    focusDate = new Date(currentTimeline[idx + 1] + 'T12:00:00');
                    if(!editingId) document.getElementById('date').value = getLocalDateString(focusDate);
                    renderAgenda();
                }
            });

            document.getElementById('date').addEventListener('change', (e) => {
                if(e.target.value && !editingId) {
                    focusDate = new Date(e.target.value + 'T12:00:00');
                    renderAgenda();
                }
            });

            document.getElementById('activity-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if(!isAdmin) {
                    alert('Debes iniciar sesión.');
                    return;
                }

                const selectedAreas = [];
                document.querySelectorAll('#areas-container input[type="checkbox"]:checked').forEach(cb => selectedAreas.push(cb.value));

                const activityData = {
                    title: document.getElementById('title').value,
                    date: document.getElementById('date').value,
                    hora: document.getElementById('hora').value,
                    coordinador: document.getElementById('coordinador').value,
                    lugar: document.getElementById('lugar').value,
                    imagen_url: document.getElementById('imagen_url').value,
                    areas: selectedAreas,
                    objetivo: document.getElementById('objetivo').value,
                    materiales: document.getElementById('materiales').value,
                    introduccion: document.getElementById('introduccion').value,
                    desarrollo: document.getElementById('desarrollo').value,
                    conclusion: document.getElementById('conclusion').value,
                    plan_b: document.getElementById('plan_b').value,
                    asistencia: [...currentAttendanceSelection]
                };

                const activitiesRef = collection(db, 'activities');
                
                try {
                    if (editingId) {
                        const docRef = doc(db, 'activities', editingId);
                        await updateDoc(docRef, activityData);
                        cancelEdit(); 
                    } else {
                        activityData.completed = false; 
                        await addDoc(activitiesRef, activityData);
                        
                        document.getElementById('activity-form').reset();
                        currentAttendanceSelection = [];
                        document.getElementById('attendance-count').textContent = '0';
                        toggleForm(); 
                    }
                    
                    focusDate = new Date(activityData.date + 'T12:00:00'); 
                    document.getElementById('date').value = activityData.date;
                    renderAgenda();
                    
                } catch(error) {
                    console.error("Error al guardar: ", error);
                    alert("Ocurrió un error al guardar. Revisa tu conexión y los permisos.");
                }
            });
        };
    </script>
</body>
</html>
